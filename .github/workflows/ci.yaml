name: ShopOps CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint & test every microservice.
  # Services are onboarded incrementally (only product-service exists today),
  # so a service without a package.json yet is skipped rather than failing
  # the matrix.
  # ---------------------------------------------------------------------------
  test-and-lint:
    name: Lint & Test Services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [product-service, order-service, payment-service]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check whether service exists yet
        id: service-check
        run: |
          if [ -f "services/${{ matrix.service }}/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::services/${{ matrix.service }} not implemented yet, skipping"
          fi

      - name: Setup Node.js 20
        if: steps.service-check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install Dependencies
        if: steps.service-check.outputs.exists == 'true'
        working-directory: ./services/${{ matrix.service }}
        run: npm ci

      - name: Run Tests
        if: steps.service-check.outputs.exists == 'true'
        working-directory: ./services/${{ matrix.service }}
        run: npm test --if-present

  # ---------------------------------------------------------------------------
  # Job 2: Build, scan, then push images to GHCR.
  # Only runs on pushes to main. Skips any service without a Dockerfile yet.
  # The image is built locally first (push: false, load: true) so Trivy scans
  # it *before* anything reaches the registry. A CRITICAL finding fails the
  # job and the push step never runs; HIGH findings are reported but don't
  # block.
  # ---------------------------------------------------------------------------
  build-scan-push:
    name: Build, Scan & Push Images to GHCR
    needs: test-and-lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [product-service, order-service, payment-service]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check whether service exists yet
        id: service-check
        run: |
          if [ -f "services/${{ matrix.service }}/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::services/${{ matrix.service }} has no Dockerfile yet, skipping"
          fi

      - name: Set up Docker Buildx
        if: steps.service-check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.service-check.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags, Labels)
        if: steps.service-check.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Image Locally (no push yet)
        if: steps.service-check.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            shopops-${{ matrix.service }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Vulnerability Report (HIGH + CRITICAL, informational)
        if: steps.service-check.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "shopops-${{ matrix.service }}:scan"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

      - name: Vulnerability Gate (CRITICAL fails the build)
        if: steps.service-check.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "shopops-${{ matrix.service }}:scan"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"

      - name: Push Docker Image (only after a clean scan)
        if: steps.service-check.outputs.exists == 'true'
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done
