name: ShopOps CI/CD

# ---------------------------------------------------------------------------
# Trigger on pushes to main (build + publish images) and on PRs targeting
# main (test only, plus a non-publishing image build to catch Dockerfile
# regressions before merge).
# ---------------------------------------------------------------------------
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Test & lint every microservice.
  # Services are onboarded incrementally, so a service without a
  # package.json yet is skipped instead of failing the matrix.
  # -------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [product-service, order-service, payment-service]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check whether service exists yet
        id: service-check
        run: |
          if [ -f "services/${{ matrix.service }}/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::services/${{ matrix.service }} not implemented yet, skipping"
          fi

      - name: Set up Node.js (LTS)
        if: steps.service-check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        if: steps.service-check.outputs.exists == 'true'
        working-directory: services/${{ matrix.service }}
        run: npm ci || npm install

      - name: Run tests
        if: steps.service-check.outputs.exists == 'true'
        working-directory: services/${{ matrix.service }}
        run: npm test

  # -------------------------------------------------------------------------
  # Job 2: Build (and, on main, publish) Docker images to GHCR.
  # Pull requests only build images (to validate the Dockerfile); pushes to
  # main also push the resulting image tagged with `latest` and the commit
  # SHA.
  # -------------------------------------------------------------------------
  build-and-push:
    name: Build & push (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [product-service, order-service, payment-service]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check whether service exists yet
        id: service-check
        run: |
          if [ -f "services/${{ matrix.service }}/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::services/${{ matrix.service }} has no Dockerfile yet, skipping"
          fi

      - name: Set up Docker Buildx
        if: steps.service-check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      # Only authenticate to the registry when we actually intend to push
      # (i.e. not on pull requests), keeping the GITHUB_TOKEN usage minimal.
      - name: Log in to GitHub Container Registry
        if: steps.service-check.outputs.exists == 'true' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata (tags & labels)
        if: steps.service-check.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push image
        if: steps.service-check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
