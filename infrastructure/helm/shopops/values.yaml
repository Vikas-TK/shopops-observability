# Default values for the shopops chart.
# Each entry under `services` becomes one Deployment + ClusterIP Service via
# templates/deployment.yaml. `enabled: false` skips a service entirely, which
# is how order-service/payment-service are declared here before they have a
# real image to deploy — flip to `true` once their image exists.
services:
  productService:
    enabled: true
    name: product-service
    replicaCount: 1
    image:
      repository: shopops-product-service
      tag: local
      pullPolicy: IfNotPresent
    service:
      port: 3000

  orderService:
    enabled: false
    name: order-service
    replicaCount: 1
    image:
      repository: shopops-order-service
      tag: local
      pullPolicy: IfNotPresent
    service:
      port: 3000

  paymentService:
    enabled: false
    name: payment-service
    replicaCount: 1
    image:
      repository: shopops-payment-service
      tag: local
      pullPolicy: IfNotPresent
    service:
      port: 3000

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Enterprise pod/container security baseline (Module 3.3 hardening). Applied
# uniformly to every service via templates/deployment.yaml — overridable per
# environment, but production should never relax these.
securityContext:
  pod:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  container:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
