# Default values for the shopops chart.
# Each entry under `services` becomes one Deployment + ClusterIP Service via
# templates/deployment.yaml. `enabled: false` skips a service entirely.
services:
  productService:
    enabled: true
    name: product-service
    replicaCount: 1
    image:
      repository: shopops-product-service
      tag: local
      pullPolicy: IfNotPresent
    service:
      port: 3000

  orderService:
    enabled: true
    name: order-service
    replicaCount: 1
    image:
      repository: shopops-order-service
      tag: local
      pullPolicy: IfNotPresent
    service:
      port: 3000

  paymentService:
    enabled: true
    name: payment-service
    replicaCount: 1
    image:
      repository: shopops-payment-service
      tag: local
      pullPolicy: IfNotPresent
    service:
      port: 3000

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 200m
    memory: 256Mi
