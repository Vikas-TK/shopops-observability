# Tails /var/log/containers/*.log rather than /var/log/pods/* directly.
# On kind (containerd), /var/log/containers/*.log are symlinks into
# /var/log/pods/..., but their filenames encode <pod>_<namespace>_
# <container>-<container_id>.log — the exact pattern the Kubernetes
# filter's built-in regex needs to attach pod/namespace/container
# metadata without an extra kubelet API round-trip. /var/log/pods/*
# directory names (<namespace>_<pod>_<uid>) don't match that regex, so
# tailing them directly would leave every log line unlabeled.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: monitoring
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        multiline.parser  docker, cri
        Tag               kube.*
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        DB                /tail-db/flb-tail-pos.db

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

    [OUTPUT]
        Name         loki
        Match        kube.*
        Host         loki.monitoring.svc.cluster.local
        Port         3100
        Line_format  json
        Remove_keys  kubernetes, stream
        Labels       job=fluent-bit, namespace=$kubernetes['namespace_name'], pod=$kubernetes['pod_name'], container=$kubernetes['container_name'], app=$kubernetes['labels']['app']

  parsers.conf: |
    [PARSER]
        Name        json
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
