# Tells Grafana to auto-load any dashboard JSON dropped into
# /var/lib/grafana/dashboards on boot, so the RED-metrics dashboard below
# (and any future ones) appear with no manual "Import dashboard" step.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: shopops
        orgId: 1
        folder: ShopOps
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
